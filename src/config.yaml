# Wspólne hiperparametry zespołu — strojenie w M2/M4.

random_seed: 42
num_clients: 3

data:
  train_path: data/KDDTrain+.txt
  test_path: data/KDDTest+.txt
  processed_dir: data/processed
  shards_dir: data/shards
  shard_partition: iid  # podkatalog shards_dir/<preprocessing> (iid, category, dirichlet_a0.5, ...)
  preprocessing: full  # full (metoda 1, wszystkie cechy) | extracted (metoda 2)
  dirichlet_alpha: 0.5

model:
  input_dim: null  # auto: odczyt z data/processed/<preprocessing>/meta.json
  hidden_dims: [128, 64]
  num_classes: 2  # binarne normal vs atak (mapowanie wieloklasowe w preprocess)

training:
  local_epochs: 1
  batch_size: 256
  learning_rate: 0.001
  # M2.2: twórz Adama od nowa po każdej aktualizacji wag FedAvg (inaczej zostają stare momenty).
  reset_optimizer_each_round: true

features:  # metoda obróbki nr 2 (ekstrakcja cech), patrz src/features.py
  method: pca  # filter | select | pca
  corr_threshold: 0.95
  k: 40  # tylko select
  n_components: 0.95  # tylko pca (udział wariancji)

federated:
  num_rounds: 5
  strategy: fedavg_weighted

evaluation:
  f1_threshold: 0.89